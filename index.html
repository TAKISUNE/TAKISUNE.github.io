<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="google-site-verification" content="jVFIE9sfK9AyC1_1JKYysISxsWbJ0F1Kom5V5a2SMfk" />
<title>PCC SHE Workspace</title>
<style>
  :root { --bg:#f5f6fa; --card:#ffffff; --ink:#1f2433; --muted:#6b7280; --accent:#3f4f8f; --line:#e3e6ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161f; --card:#1a1f2b; --ink:#e6e8ef; --muted:#9aa3b5; --accent:#8b9be0; --line:#2a3040; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  main { background:var(--card); border:1px solid var(--line); border-radius:4px; max-width:520px; width:100%; padding:36px 32px; }
  .mark { display:inline-block; width:12px; height:12px; background:var(--accent); border-radius:2px; margin-right:10px; vertical-align:middle; }
  h1 { font-size:22px; margin:0 0 12px; letter-spacing:.2px; }
  p { margin:0 0 16px; color:var(--muted); }
  .note { border-top:1px solid var(--line); padding-top:16px; font-size:14px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1><span class="mark"></span>PCC SHE Workspace</h1>
  <p>Internal safety, health and environment (SHE) management workspace for an authorized project team.</p>
  <p>Access is restricted to registered Google accounts. There is no public content on this site.</p>
  <p class="note"><a href="privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
