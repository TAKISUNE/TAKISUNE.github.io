<style>
/* palette = she-obsgate-appsscript/Form.html (light + dark) */
:root{
  --bg:#f2f5f9; --bg2:#e9eef5; --card:#ffffff; --border:#d6dee8; --border2:#c3cedb;
  --text:#16202c; --text2:#546578; --muted:#66788e; --track:#f1f4f8;
  --green:#0f8a63; --green-bg:#e2f5ec; --green-text:#0b5c43;
  --amber:#c98a0b; --amber-bg:#fbf0da; --amber-text:#6b4405;
  --red:#c0392b; --red-bg:#fcebeb; --red-text:#501313;
  --accent:#263BAA; --accent-bg:#e6eaf8; --accent-text:#1a2b7d; --accent-ink:#ffffff;
  --live:#0e7490; --live-bg:#ddf0f5;
  --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.05);
  --r-card:12px; --r-ctl:10px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d1016; --bg2:#12161f; --card:#161b24; --border:#242c3a; --border2:#333c4d;
  --text:#e6ebf2; --text2:#9aa4b4; --muted:#68707e; --track:#1c222c;
  --green:#33c98e; --green-bg:#0f2e24; --green-text:#7fe6bd;
  --amber:#f0b429; --amber-bg:#33290f; --amber-text:#f0c674;
  --red:#e8574a; --red-bg:#361a17; --red-text:#f3a29a;
  --accent:#7B8FF5; --accent-bg:#1f2547; --accent-text:#b6c1fb; --accent-ink:#0d1130;
  --live:#22d3ee; --live-bg:#0e3038;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;display:flex;flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.appbar{flex:none;background:var(--bg2);border-bottom:1px solid var(--border);padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top))}
.who{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;min-height:20px}
.who .vf{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:var(--green-bg);color:var(--green-text);border:1px solid var(--green)}
.who .frac{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.prog{margin-top:7px;height:2px;background:var(--track);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--live);transition:width .25s}
.scr{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.body{padding:12px 14px 22px;max-width:640px;margin:0 auto}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode button{all:unset;cursor:pointer;text-align:center;padding:12px 8px;border-radius:var(--r-ctl);border:1px solid var(--border2);background:var(--card);font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--text2)}
.mode .on.find{border-color:var(--live);background:var(--live-bg);color:var(--live)}
.mode .on.gp{border-color:var(--green);background:var(--green-bg);color:var(--green-text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;gap:9px;padding:12px 12px 8px}
.sh .no{width:21px;height:21px;flex:0 0 21px;border-radius:50%;border:1px solid var(--border2);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--text2)}
.card.done .sh .no{background:var(--green-bg);border-color:var(--green);color:var(--green-text)}
.sh .tt{font-size:13px;font-weight:700}
.sh .tt .th{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:7px}
.sb{padding:4px 12px 14px}
.f{display:block;margin-bottom:13px}
.f:last-child{margin-bottom:0}
.lb{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--text2);margin-bottom:6px}
.lb .rq{color:var(--red);margin-right:4px}
.lb .th{letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted);font-size:11px;margin-left:6px}
.lb .th:before{content:"· "}
.lb .cnt{float:right;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted);font-size:10.5px}
.lb .cnt.low{color:var(--amber-text)}
.inp{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border2);border-radius:var(--r-ctl);padding:11px;font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.inp{min-height:92px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:-2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{all:unset;cursor:pointer;box-sizing:border-box;padding:12px 8px;border-radius:var(--r-ctl);border:1px solid var(--border2);background:var(--bg2);font-size:13px;font-weight:700;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;color:var(--text)}
.tile small{font-size:10.5px;font-weight:600;color:var(--muted)}
.tile.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-text)}
.tile.on small{color:var(--accent-text)}
.tile.dim{opacity:.42;cursor:not-allowed}
.phd{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text2);margin:0 0 7px}
.shot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.slot{aspect-ratio:1;border:1px dashed var(--border2);border-radius:var(--r-ctl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--bg2);cursor:pointer;color:var(--muted);position:relative;overflow:hidden;font-size:12.5px;font-weight:700;text-align:center}
.slot .ic{font-size:22px}
.slot.has{border:1px solid var(--green)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .x{all:unset;cursor:pointer;position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;text-align:center;line-height:24px;font-size:14px;z-index:2}
.reqtag{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--red-bg);color:var(--red-text);padding:2px 6px;border-radius:2px}
.hint{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.hint.ok{color:var(--green-text)}
.gpskip{border:1px dashed var(--border2);border-radius:var(--r-card);background:var(--bg2);padding:12px;font-size:12px;color:var(--muted)}
.foot{flex:none;background:var(--bg2);border-top:1px solid var(--border);padding:9px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.slim{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--track);font-size:12px;color:var(--text2)}
.slim b{color:var(--amber-text);flex:none}
.slim span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slim u{text-decoration:none;color:var(--accent-text);font-weight:800;font-size:10px;letter-spacing:.06em}
.slim.ok{background:var(--green-bg);color:var(--green-text)}
.slim.ok b{color:var(--green-text)}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;text-align:center;padding:14px 10px;border-radius:var(--r-ctl);background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:800}
.btn[aria-disabled="true"]{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.screen{padding:28px 18px;max-width:520px;margin:0 auto;text-align:center}
.screen h2{font-size:18px;margin:10px 0 6px}
.screen p{color:var(--text2);font-size:14px;margin:0 0 14px}
.screen .big{font-size:40px}
.screen .inp{text-align:left;margin-bottom:10px}
.screen a{color:var(--accent-text);font-weight:700}
.screen .tiles{text-align:center}
.err{background:var(--red-bg);color:var(--red-text);border-radius:var(--r-ctl);padding:10px 12px;font-size:13px;margin:0 0 12px;text-align:left}
.note{background:var(--amber-bg);color:var(--amber-text);border-radius:var(--r-ctl);padding:9px 12px;font-size:12.5px;margin:0 0 12px}
.spin{width:30px;height:30px;border:3px solid var(--accent-bg);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
.overlay.show{display:flex}
.overlay .box{background:var(--card);border-radius:14px;padding:22px 26px;text-align:center;font-weight:800;color:var(--accent-text);min-width:200px}
.overlay .box small{display:block;font-weight:600;color:var(--muted);margin-top:6px}
/* v3 6 Oct 2026 */
.datebox{position:relative}
.datebox .show{pointer-events:none}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.pgo{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%}
.pmeta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--text2);font-weight:600;margin-bottom:6px}
.pmeta b{color:var(--text)}
.pmeta .go{color:var(--accent-text);font-weight:800;font-size:10.5px;letter-spacing:.05em}
.seg{display:flex;gap:4px}
.seg span{flex:1;height:7px;border-radius:3px;background:var(--track);transition:background .3s}
.seg span.on{background:var(--live)}
.seg.done span{background:var(--green)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;color:var(--accent-text);border:1px solid var(--accent)}
.savedok{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green);border-radius:var(--r-ctl);padding:11px 12px;font-size:14px;font-weight:800;margin-bottom:12px;text-align:center}
.qn{display:inline-block;min-width:20px;padding:1px 7px;margin-left:4px;border-radius:99px;background:var(--accent-bg);color:var(--accent-text);font-size:12px;font-weight:800;text-align:center;vertical-align:1px}
.qbar{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;margin:0 0 12px;padding:11px 14px;border:1px solid var(--accent);border-radius:var(--r-ctl);background:var(--accent-bg);color:var(--accent-text);font-size:14px;font-weight:800}
.qbar b{font-size:13px}
.qbar .qn{background:var(--accent);color:var(--accent-ink)}
.qcard{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:9px;background:var(--card)}
.qcard:last-child{margin-bottom:0}
.qtop{display:flex;align-items:center;gap:8px}
.qtop .k{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:5px}
.k.f{background:var(--live-bg);color:var(--live)}.k.g{background:var(--green-bg);color:var(--green-text)}
.qt{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qsub{font-size:11.5px;color:var(--muted);margin-top:4px}
.flagpill{all:unset;cursor:pointer;flex:none;font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px;border:1px solid var(--border2);color:var(--text2)}
.flagpill.open{border-color:var(--accent);color:var(--accent-text)}
.flagpill.on2{border-color:var(--amber);background:var(--amber-bg);color:var(--amber-text)}
.flagpill.on{border-color:var(--red);background:var(--red-bg);color:var(--red-text)}
.rpt{margin-top:9px;padding:9px;border-radius:9px;background:var(--bg2)}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.rpt .tile{padding:9px 4px;font-size:12px}
.rpt .tile.rp2.on{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text)}
.rpt .tile.rp3.on{background:var(--red-bg);border-color:var(--red);color:var(--red-text)}
.rpt textarea.inp{min-height:64px;margin-top:2px}
.qact{display:flex;gap:7px;margin-top:9px}
.qact button{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--accent-text);padding:4px 10px;border:1px solid var(--border2);border-radius:7px}

/* ---- photo editor (D1 + E1, 7 Oct 2026) ---- */
.slot .edbtn{all:unset;cursor:pointer;position:absolute;inset:0;z-index:1;display:flex;align-items:flex-end;padding:6px}

</style>

<div class="appbar" id="appbar" hidden>

</div>
<div class="scr" id="scr"><div class="body" id="body"><div class="screen"><div class="spin"></div><p style="margin-top:12px" id="bootmsg">Opening form…</p><small id="boott" style="color:var(--muted);font-size:11.5px"></small></div></div></div>
<div class="foot" id="foot" hidden></div>
<div class="overlay" id="overlay"><div class="box"><div class="spin"></div><div style="margin-top:10px" id="ovtxt">Sending…</div><small id="ovsub"></small></div></div>

<div id="pe" aria-modal="true" role="dialog"><div id="pebar"></div>
  <div id="pestage"><canvas id="pecv"></canvas><div id="petoast"></div><button type="button" id="pefit">⤢ Fit</button>
    <div id="pecrop"><button type="button" id="pecropNo">Cancel</button><button type="button" class="ok" id="pecropOk">✓ Crop</button></div></div></div>

<script>
/* ---------------- config (none of these are secrets) ---------------- */
var LIFF_ID  = '2011753283-aXvW2oCZ';
var API      = 'https://script.google.com/macros/s/AKfycbyABXSxD4f4ZWa1pY74N5lzyc2pYDZiXllVwTR8GKsPtqeGhDi58YrLhQ03wTfkDUgk/exec';
var MAXP     = 4;          /* photos per group — same as obsform */
var SHRINK   = 2048;       /* TK 26 Sep: LINE-like quality, still fast from site */
var JPEGQ    = 0.80;
var OTYPES   = [['ua','Unsafe Action','การกระทำไม่ปลอดภัย'],['uc','Unsafe Condition','สภาพการณ์ไม่ปลอดภัย'],
                ['env','Environment Impact','มีผลกระทบต่อสิ่งแวดล้อม'],['oth','Other','อื่นๆ — ระบุ']];
var LS_DRAFT = 'line_obs_draft_v1', LS_OUT = 'line_obs_outbox_v1';

var BOOT = null, TOKEN = '', S = null, SENDING = false;   /* v3 6 Oct 2026: queue (Save → Send All) */

/* ---------------- small helpers ---------------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return '';var p=iso.split('-');return Number(p[2])+' '+MON[+p[1]-1]+' '+p[0];}
function dueDate(n){var d=new Date((S.date||BOOT.today).replace(/-/g,'/'));d.setDate(d.getDate()+n);return d.getDate()+' '+MON[d.getMonth()];}
function blank(){return {mode:'find',date:BOOT.today,area:'',subArea:'',otherSub:'',company:'',otherCo:'',loc:'',otype:'',otherType:'',
  found:'',rec:'',due:1,pf:[],pa:[],pfx:[],pax:[]};}

var _tokOk,TOKEN_P=new Promise(function(r){_tokOk=r;});
function api(action, extra){return TOKEN_P.then(function(){
  var body = Object.assign({liff:1, action:action, idToken:TOKEN}, extra||{});
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();});
});}

/* ---------------- start ---------------- */
var T0=Date.now(),BOOT_MS={};
function bootStep(msg){var m=$('bootmsg');if(m)m.textContent=msg;}
var _bt=setInterval(function(){var t=$('boott');if(!t||BOOT){clearInterval(_bt);return;}t.textContent=((Date.now()-T0)/1000).toFixed(1)+' s';},200);
/* r3 7 Oct: boot took 8–10 s on site (LIFF init + Apps Script cold start). Stale-while-revalidate:
   an approved user's last boot is cached; the form opens from it at once, the real boot runs behind and
   only takes over if the binding changed. Submits are still verified server-side with the ID token. */
var LS_BOOTC='line_obs_boot_cache_v1', FAST=false;
function todayBKK(){return new Date(Date.now()+7*3600e3).toISOString().slice(0,10);}
function start(){
  var c=lsGet(LS_BOOTC,null);
  if(c&&c.boot&&c.at&&(Date.now()-c.at)<14*864e5){FAST=c.sub||true;showForm(Object.assign({},c.boot,{today:todayBKK()}));}
  else bootStep('Signing in with LINE…');
  liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    BOOT_MS.liff=Date.now()-T0;
    TOKEN = liff.getIDToken() || '';_tokOk();
    var sub='';try{sub=(liff.getDecodedIDToken()||{}).sub||'';}catch(e){}
    if(FAST&&FAST!==true&&sub&&FAST!==sub){FAST=false;lsSet(LS_BOOTC,null);location.reload();return;}   /* another LINE account on this phone */
    bootStep('Loading your form…');
    return api('boot').then(function(r){if(r&&r.ok&&r.status==='approved')lsSet(LS_BOOTC,{sub:sub,at:Date.now(),boot:r.boot});
      else if(r&&r.ok)lsSet(LS_BOOTC,null);
      if(FAST){if(r&&r.ok&&r.status==='approved'){BOOT=Object.assign(r.boot,{today:r.boot.today||todayBKK()});return;}if(!r||!r.ok)return;}BOOT_MS.server=Date.now()-T0-BOOT_MS.liff;BOOT_MS.total=Date.now()-T0;lsSet('line_obs_boot_ms',BOOT_MS);try{console.log('boot ms',JSON.stringify(BOOT_MS));}catch(e){}onBoot(r);});
  }).catch(function(e){if(FAST){_tokOk();return;}screenError('เปิดฟอร์มไม่สำเร็จ',String(e&&e.message||e));});
}
function onBoot(r){
  if(!r||!r.ok){screenError('เปิดฟอร์มไม่สำเร็จ',(r&&r.error)||'no response');return;}
  if(r.status==='unbound'){screenBind(r.lineName);return;}
  if(r.status==='pending'){BIND.lineName=r.lineName||'';screenPending(r.officer);return;}
  if(r.status==='rejected'){screenError('บัญชี LINE นี้ยังใช้ฟอร์มไม่ได้','แจ้ง TK เพื่อตรวจสอบ');return;}
  showForm(r.boot);
}
function showForm(boot){
  BOOT=boot;
  idbOpen().then(function(){return Promise.all([idbGet('queue'),idbGet('draft')]);}).then(function(v){
    QUEUE=Array.isArray(v[0])?v[0]:[];
    var d=lsGet(LS_DRAFT,null);
    S=v[1]?Object.assign(blank(),v[1]):((d&&d.v===1)?Object.assign(blank(),d.s):blank());
    $('appbar').hidden=false;$('foot').hidden=false;
    render();
    flushOutbox();
  });
}

/* ---------------- non-form screens ---------------- */
function bare(html){$('appbar').hidden=true;$('foot').hidden=true;$('body').innerHTML='<div class="screen">'+html+'</div>';}
function screenError(t,msg){bare('<div class="big">⚠️</div><h2>'+esc(t)+'</h2><div class="err">'+esc(msg)+'</div><button class="btn ghost" onclick="location.reload()">ลองใหม่</button>');}
function screenPending(name){bare('<div class="big">⏳</div><h2>รอ TK อนุมัติ</h2><p>ส่งคำขอผูกบัญชีเป็น <b>'+esc(name||'')+'</b> แล้ว<br>พอ TK อนุมัติ เปิดฟอร์มอีกครั้งก็ใช้ได้เลย (ทำครั้งเดียว)</p><button class="btn ghost" onclick="location.reload()">เช็คอีกครั้ง</button><p style="margin-top:14px;font-size:12px"><a href="#" onclick="screenBind();return false;">ไม่อยากรอ? ยืนยันด้วยอีเมลหรือรหัสเชิญ</a></p>');}
/* 6 Oct 2026 v2 — self-service binding (TK chose OTP + invite code; TK approval kept as fallback)
   E = email → 6-digit code mailed to the Officers address → APPROVED
   I = invite code TK wrote in tab LineInvite → APPROVED (for people with no email) */
var BIND={lineName:'',mode:'E',email:'',sent:'',err:'',busy:false};
function screenBind(lineName,err){
  if(lineName)BIND.lineName=lineName;
  if(err!==undefined)BIND.err=err||'';
  var B=BIND,tab=function(m,t){return '<button type="button" class="tile'+(B.mode===m?' on':'')+'" data-bm="'+m+'">'+t+'</button>';};
  var body;
  if(B.mode==='E'&&!B.sent){
    body='<p>พิมพ์อีเมลที่ลงทะเบียนกับ TK ระบบจะส่ง<b>รหัส 6 หลัก</b>ไปที่อีเมลนั้น</p>'+
      '<input class="inp" id="bEmail" type="email" autocomplete="email" inputmode="email" placeholder="name@gmail.com" value="'+esc(B.email)+'">'+
      '<button class="btn" id="bGo">ส่งรหัสไปที่อีเมล</button>';
  }else if(B.mode==='E'){
    body='<p>ส่งรหัสไปที่ <b>'+esc(B.sent)+'</b> แล้ว<br>เปิดอีเมล (เช็คใน Spam ด้วย) แล้วพิมพ์รหัสที่นี่ · ใช้ได้ 10 นาที</p>'+
      '<input class="inp" id="bCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" style="text-align:center;font-size:24px;letter-spacing:8px">'+
      '<button class="btn" id="bGo">ยืนยัน</button>'+
      '<p style="margin-top:12px"><a href="#" id="bResend">ส่งรหัสใหม่</a> · <a href="#" id="bChange">เปลี่ยนอีเมล</a></p>';
  }else{
    body='<p>ใส่<b>รหัสเชิญ</b>ที่ได้จาก TK</p>'+
      '<input class="inp" id="bCode" autocomplete="off" placeholder="รหัสเชิญ" style="text-align:center;font-size:20px;letter-spacing:4px;text-transform:uppercase">'+
      '<button class="btn" id="bGo">ยืนยัน</button>';
  }
  bare('<div class="big">👋</div><h2>ครั้งแรก — ผูกบัญชีก่อนนะคะ</h2><p>LINE: <b>'+esc(B.lineName)+'</b></p>'+
    '<div class="tiles" style="margin:0 0 14px">'+tab('E','📧 ยืนยันด้วยอีเมล')+tab('I','🔑 มีรหัสเชิญ')+'</div>'+
    (B.err?'<div class="err">'+esc(B.err)+'</div>':'')+body+
    '<p style="margin-top:18px;font-size:12px"><a href="#" id="bAsk">ไม่มีทั้งสองอย่าง — ขอให้ TK อนุมัติแทน</a></p>');
  var go=$('bGo'),f=$('bEmail')||$('bCode');
  if(f){f.focus();f.onkeydown=function(e){if(e.key==='Enter')go.click();};}
  document.querySelectorAll('[data-bm]').forEach(function(x){x.onclick=function(){B.mode=x.dataset.bm;B.err='';screenBind();};});
  var busy=function(t){go.setAttribute('aria-disabled','true');go.textContent=t;};
  var fail=function(r,e){B.err=(r&&r.error)||('เน็ตไม่เสถียร ลองอีกครั้ง'+(e?' ('+e+')':''));screenBind();};
  var done=function(r){if(r&&r.ok&&r.status==='approved'){location.reload();return true;}return false;};
  go.onclick=function(){
    if(go.getAttribute('aria-disabled')==='true')return;
    if(B.mode==='E'&&!B.sent){
      var em=($('bEmail').value||'').trim().toLowerCase();B.email=em;
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){B.err='รูปแบบอีเมลไม่ถูกต้อง';screenBind();return;}
      busy('กำลังส่งรหัส…');
      api('otpSend',{email:em}).then(function(r){if(done(r))return;if(!r||!r.ok)return fail(r);B.sent=r.to||em;B.err='';screenBind();}).catch(function(e){fail(null,e);});
    }else if(B.mode==='E'){
      var c=($('bCode').value||'').replace(/\D/g,'');
      if(c.length!==6){B.err='รหัสต้องมี 6 หลัก';screenBind();return;}
      busy('กำลังยืนยัน…');
      api('otpVerify',{code:c}).then(function(r){if(done(r))return;fail(r);}).catch(function(e){fail(null,e);});
    }else{
      var ic=($('bCode').value||'').trim();
      if(!ic){B.err='ใส่รหัสเชิญก่อนนะคะ';screenBind();return;}
      busy('กำลังยืนยัน…');
      api('invite',{code:ic}).then(function(r){if(done(r))return;fail(r);}).catch(function(e){fail(null,e);});
    }
  };
  if($('bResend'))$('bResend').onclick=function(e){e.preventDefault();B.sent='';go=null;
    api('otpSend',{email:B.email}).then(function(r){if(done(r))return;if(!r||!r.ok)return fail(r);B.sent=r.to||B.email;B.err='ส่งรหัสใหม่แล้ว';screenBind();}).catch(function(x){fail(null,x);});};
  if($('bChange'))$('bChange').onclick=function(e){e.preventDefault();B.sent='';B.err='';screenBind();};
  $('bAsk').onclick=function(e){e.preventDefault();screenAsk();};
}
/* fallback (v1): request → TK sets APPROVED in tab LineBind */
function screenAsk(err){
  bare('<div class="big">🙋</div><h2>ขอให้ TK อนุมัติ</h2><p>พิมพ์อีเมลที่ลงทะเบียนกับ TK แล้วรอ TK อนุมัติในระบบ</p>'+
    (err?'<div class="err">'+esc(err)+'</div>':'')+
    '<input class="inp" id="aEmail" type="email" inputmode="email" placeholder="name@gmail.com">'+
    '<button class="btn" id="aGo">ส่งคำขอ</button><p style="margin-top:12px"><a href="#" id="aBack">‹ กลับ</a></p>');
  $('aBack').onclick=function(e){e.preventDefault();screenBind();};
  $('aGo').onclick=function(){
    var em=($('aEmail').value||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){screenAsk('รูปแบบอีเมลไม่ถูกต้อง');return;}
    $('aGo').setAttribute('aria-disabled','true');$('aGo').textContent='กำลังส่ง…';
    api('bind',{email:em}).then(function(r){
      if(!r||!r.ok){screenAsk((r&&r.error)||'ส่งไม่สำเร็จ');return;}
      if(r.status==='approved'){location.reload();return;}
      screenPending(r.officer);
    }).catch(function(e){screenAsk('เน็ตไม่เสถียร ลองอีกครั้ง ('+e+')');});
  };
}

/* =====================================================================
   v3 (6 Oct 2026, TK from line_v3_mockup): W2 "Date & Location" · Thai after English on one line ·
   date shown "06 Oct 2026" · GP hides Observation Type + Close Due · P2 segmented progress ·
   S1 Save → Ready to send (flag + follow-up note, edit, remove) → "+ Add More" / "Send All".
   Queue + draft live in IndexedDB WITH photos, so closing LINE loses nothing.
   ===================================================================== */
var SAVED_FLASH=false;   /* r2 7 Oct: "✓ Saved" banner only right after Save, not when opened from the banner */
var QUEUE=[], JUST_SAVED=false, FLAG_OPEN=-1, EDIT_FROM=0;

/* ---------------- tiny IndexedDB store (falls back to memory) ---------------- */
var IDB=null;
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open('line_obs_v3',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){IDB=r.result;res();};r.onerror=function(){res();};}catch(e){res();}});}
function idbGet(k){return new Promise(function(res){if(!IDB)return res(null);try{var q=IDB.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbPut(k,v){if(!IDB)return;try{IDB.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
var _dT=null;
function saveDraft(){lsSet(LS_DRAFT,{v:1,s:Object.assign({},S,{pf:[],pa:[],pfx:[],pax:[]})});clearTimeout(_dT);_dT=setTimeout(function(){idbPut('draft',S);},400);}
function saveQueue(){idbPut('queue',QUEUE);}

/* ---------------- validation ---------------- */
function gp(){return S.mode==='gp';}
function coName(){return S.company==='__other'?S.otherCo.trim():S.company;}
/* one entry per required field = one segment of the P2 bar */
function checks(){
  var c=[['area','Area',!!S.area],['company','Company',!!coName()]];
  if(!gp())c.push(['otype','Type',!!(S.otype&&(S.otype!=='oth'||S.otherType.trim()))]);
  c.push(['photo','Photo',S.pf.length>0]);
  c.push(['found','Found',S.found.trim().length>=10]);
  if(!gp())c.push(['rec','Recommendation',S.rec.trim().length>=10]);
  return c;
}
function missingList(){return checks().filter(function(x){return !x[2];});}
function ready(){return !missingList().length;}
function secDone(id){
  if(id==='area')return !!(S.area&&coName());
  if(id==='otype')return !!(S.otype&&(S.otype!=='oth'||S.otherType.trim()));
  if(id==='photo')return S.pf.length>0;
  return S.found.trim().length>=10&&(gp()||S.rec.trim().length>=10);
}
function dirty(){return !!(S.found.trim()||S.rec.trim()||S.otype||S.pf.length||S.pa.length);}

function fmtLong(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return '';var p=iso.split('-');return p[2]+' '+MON[+p[1]-1]+' '+p[0];}

function group(g,arr,label,req){

function secDetail(){
  var dues=[[0,'Already closed',S.pa.length?'แก้ไขแล้ว':'ต้องมีรูป After ก่อน'],[1,'Tomorrow',dueDate(1)],[2,'+2 days',dueDate(2)],[3,'+3 days',dueDate(3)]];

/* ---------------- Ready to send (queue) ---------------- */
function rptN(e){var n=Number(e&&e.repeat)||1;return n>=3?3:(n===2?2:1);}
function qSub(e){
  var a=e.area==='BOP'&&e.subArea?(e.subArea==='TANK Laydown Area'?'TANK Laydown Area':'BOP · '+(e.subArea==='Other'?(e.otherSub||'Other'):e.subArea)):e.area;
  return [fmtLong(e.date).replace(/ \d{4}$/,''),a,e.company==='__other'?e.otherCo:e.company].filter(Boolean).join(' · ');
}
function queueHtml(){
  if(!QUEUE.length)return '';
  return '<div class="card"><div class="sh"><span class="tt">Ready to send <span class="qn">'+QUEUE.length+'</span></span></div><div class="sb">'+
    QUEUE.map(function(e,i){return [e,i];}).reverse().map(function(p){var e=p[0],i=p[1];   /* newest first; i = real index */
      var n=rptN(e),isgp=e.mode==='gp';
      return '<div class="qcard"><div class="qtop"><span class="k '+(isgp?'g':'f')+'">'+(isgp?'GOOD PRACTICE':'FINDING')+'</span>'+
        '<span class="qt">'+esc(e.found)+'</span>'+
        (isgp?'':'<button type="button" class="flagpill'+(n===3?' on':(n===2?' on2':(FLAG_OPEN===i?' open':'')))+'" data-qflag="'+i+'">🚩'+(n>1?(n===2?' 2nd':' 3+'):'')+'</button>')+'</div>'+

function afterSent(sent,err){

      :('✅ ส่ง Observation แล้ว '+sent.length+' รายการ\n'+part.map(function(s){return s.id+' · '+s.area+' · '+s.company;}).join('\n'))});

  };

  function pt(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];}
  /* ---- r3 7 Oct: pinch-zoom / two-finger pan (one finger still draws). Listeners on the stage so the 2nd finger may land off the photo. ---- */
  var Z={s:1,x:0,y:0},PTR={},PINCH=null,HOLD=false,stage=$('pestage');
  function applyZ(){if(Z.s<=1.01){Z.s=1;Z.x=0;Z.y=0;}
    var mx=(Z.s-1)*cv.clientWidth/2+40,my=(Z.s-1)*cv.clientHeight/2+40;Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y));
    cv.style.transform=Z.s===1?'':'translate('+Z.x+'px,'+Z.y+'px) scale('+Z.s+')';$('pefit').classList.toggle('on',Z.s>1);}
  function resetZ(){Z={s:1,x:0,y:0};PINCH=null;applyZ();}
  function two(){var k=Object.keys(PTR);return [PTR[k[0]],PTR[k[1]]];}
  function startPinch(){var p=two(),r=cv.getBoundingClientRect();
    PINCH={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2,s:Z.s,x:Z.x,y:Z.y,
      cx:r.left+r.width/2-Z.x,cy:r.top+r.height/2-Z.y};}
  stage.addEventListener('pointerdown',function(e){
    if(e.target.closest('button'))return;
    e.preventDefault();try{stage.setPointerCapture(e.pointerId);}catch(x){}
    PTR[e.pointerId]={x:e.clientX,y:e.clientY};
    var n=Object.keys(PTR).length;
    if(n>=2){                                   /* 2nd finger: drop the half-drawn mark, start pinch */
      if(E.drag){if(E.drag.crop)E.crop=null;E.drag=null;draw();}
      HOLD=true;if(n===2)startPinch();return;}
    if(HOLD)return;
    var p=pt(e);
    if(E.tool==='crop'){E.crop={x1:p[0],y1:p[1],x2:p[0],y2:p[1]};E.drag={crop:1};$('pecrop').classList.remove('on');draw();return;}
    var s={t:E.tool,c:E.color,w:lwFor(E.size),x1:p[0],y1:p[1],x2:p[0],y2:p[1]};if(E.tool==='pen')s.pts=[p];
    E.drag={s:s};
  });
  stage.addEventListener('pointermove',function(e){
    if(PTR[e.pointerId]){PTR[e.pointerId].x=e.clientX;PTR[e.pointerId].y=e.clientY;}
    if(PINCH&&Object.keys(PTR).length>=2){var p=two(),d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
      var ns=Math.max(1,Math.min(6,PINCH.s*d/PINCH.d));
      var qx=(PINCH.mx-PINCH.cx-PINCH.x)/PINCH.s,qy=(PINCH.my-PINCH.cy-PINCH.y)/PINCH.s;   /* photo point under the fingers stays put */
      Z.s=ns;Z.x=mx-PINCH.cx-ns*qx;Z.y=my-PINCH.cy-ns*qy;applyZ();return;}
    if(!E.drag||HOLD)return;var q=pt(e);
    if(E.drag.crop){E.crop.x2=Math.max(0,Math.min(cv.width,q[0]));E.crop.y2=Math.max(0,Math.min(cv.height,q[1]));draw();return;}
    var s=E.drag.s;s.x2=q[0];s.y2=q[1];if(s.t==='pen')s.pts.push(q);draw();
  });
  function endDrag(){
    if(!E.drag)return;
    if(E.drag.crop){E.drag=null;var c=norm(E.crop);if(c.w<cv.width*0.05||c.h<cv.height*0.05){E.crop=null;draw();toast('ลากให้กว้างขึ้นอีกนิด');return;}$('pecrop').classList.add('on');draw();return;}
    var s=E.drag.s;E.drag=null;
    var big=s.t==='pen'?s.pts.length>2:(Math.abs(s.x2-s.x1)+Math.abs(s.y2-s.y1))>s.w*3;
    if(big){snap();E.shapes.push(s);bar();}
    draw();
  }
  function ptrUp(e){delete PTR[e.pointerId];var n=Object.keys(PTR).length;
    if(n<2)PINCH=null;if(n===0){if(HOLD){HOLD=false;return;}endDrag();}}
  stage.addEventListener('pointerup',ptrUp);stage.addEventListener('pointercancel',ptrUp);
  stage.addEventListener('wheel',function(e){e.preventDefault();var r=cv.getBoundingClientRect(),cx=r.left+r.width/2-Z.x,cy=r.top+r.height/2-Z.y,
    qx=(e.clientX-cx-Z.x)/Z.s,qy=(e.clientY-cy-Z.y)/Z.s,ns=Math.max(1,Math.min(6,Z.s*(e.deltaY<0?1.15:1/1.15)));
    Z.s=ns;Z.x=e.clientX-cx-ns*qx;Z.y=e.clientY-cy-ns*qy;applyZ();},{passive:false});
  $('pefit').onclick=function(e){e.stopPropagation();resetZ();};
  function bake(){var c=cloneCanvas(E.base),g=c.getContext('2d');E.shapes.forEach(function(s){paint(g,s);});return c;}
  $('pecropOk').onclick=function(){var r=norm(E.crop);snap();var b=bake(),c=document.createElement('canvas');c.width=Math.round(r.w);c.height=Math.round(r.h);
    c.getContext('2d').drawImage(b,r.x,r.y,r.w,r.h,0,0,c.width,c.height);E.base=c;E.shapes=[];E.crop=null;$('pecrop').classList.remove('on');E.tool='box';fit();draw();bar();toast('ครอปแล้ว');};
  $('pecropNo').onclick=function(){E.crop=null;$('pecrop').classList.remove('on');draw();};
  function rotate(){snap();var b=bake(),c=document.createElement('canvas');c.width=b.height;c.height=b.width;var g=c.getContext('2d');
    g.translate(c.width,0);g.rotate(Math.PI/2);g.drawImage(b,0,0);E.base=c;E.shapes=[];fit();draw();bar();}
  function bar(){
    $('pebar').innerHTML='<div class="pe-hdr"><div class="l"><button type="button" class="pe-cancel" data-pa="cancel">Cancel</button></div><div class="pe-ur">'+
      '<button type="button" data-pa="undo"'+(E.hist.length?'':' disabled')+' aria-label="Undo">'+ic('undo')+'</button>'+
      '<button type="button" data-pa="redo"'+(E.fut.length?'':' disabled')+' aria-label="Redo">'+ic('redo')+'</button>'+
      '<span class="pe-dv"></span><button type="button" data-pa="reset"'+(canReset()?'':' disabled')+' aria-label="ล้างทั้งหมด">'+ic('erase')+'</button></div>'+
      '<div class="r"><button type="button" class="pe-done" data-pa="done">Done</button></div></div>'+
      '<div class="pe-tools">'+TOOLS.map(function(t){return '<button type="button" class="pe-tl'+(E.tool===t[0]?' on':'')+'" data-pt="'+t[0]+'">'+ic(t[0])+t[1]+'</button>';}).join('')+'</div>'+
      '<div class="pe-style"><div class="pe-cols">'+COLS.map(function(c){return '<button type="button" class="pe-sw'+(E.color===c?' on':'')+'" data-pc="'+c+'" style="background:'+c+'"></button>';}).join('')+
      '</div><div class="pe-seg">'+[2,4,7].map(function(h,i){return '<button type="button" data-psz="'+i+'"'+(E.size===i?' class="on"':'')+'><i style="height:'+h+'px"></i></button>';}).join('')+'</div></div>';
  }
  function setTool(t){
    if((t==='rotate'||t==='crop')&&E.shapes.length)toast('⚠ กรอบที่วาดไว้จะรวมเข้ากับรูป (ลบได้ด้วย ↶ เท่านั้น)',2400);
    if(t==='rotate'){rotate();return;}
    E.tool=t;E.crop=null;$('pecrop').classList.remove('on');bar();
    if(t==='crop'&&!E.shapes.length)toast('ลากเลือกส่วนที่ต้องการเก็บ');draw();
  }
  function done(){
    var arr=E.g==='F'?S.pf:S.pa,meta=metaArr(E.g),dirtyBase=E.base!==E.orig,any=E.shapes.length>0||dirtyBase,cur=meta[E.i]||null;
    if(!any){                                   /* nothing left → back to the plain original */
      arr[E.i]=cur&&cur.orig||arr[E.i];meta[E.i]=null;
    }else{
      meta[E.i]={orig:cur&&cur.orig||arr[E.i],base:dirtyBase?E.base.toDataURL('image/jpeg',0.9):null,shapes:copyShapes(E.shapes)};
      arr[E.i]=bake().toDataURL('image/jpeg',JPEGQ);
    }
    close();saveDraft();render();
  }
  $('pe').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;e.stopPropagation();
    if(b.closest('#pecrop'))return;
    if(b.dataset.pt){setTool(b.dataset.pt);return;}
    if(b.dataset.pc){E.color=b.dataset.pc;bar();return;}
    if(b.dataset.psz){E.size=+b.dataset.psz;bar();return;}
    var a=b.dataset.pa,sz=E.base&&E.base.width+'x'+E.base.height;
    if(a==='undo'||a==='redo'){var from=a==='undo'?E.hist:E.fut,to=a==='undo'?E.fut:E.hist,h=from.pop();if(!h)return;
      to.push({base:E.base,shapes:copyShapes(E.shapes)});E.base=h.base;E.shapes=copyShapes(h.shapes);E.crop=null;$('pecrop').classList.remove('on');
      if(sz!==E.base.width+'x'+E.base.height)fit();draw();bar();return;}
    if(a==='reset'){if(!canReset())return;snap();E.base=E.orig;E.shapes=[];E.crop=null;$('pecrop').classList.remove('on');fit();draw();bar();toast('กลับเป็นรูปต้นฉบับแล้ว (กด ↶ เพื่อเอาคืน)');return;}
    if(a==='cancel'){close();return;}
    if(a==='done'){done();return;}
  });
  return {open:open};
})();
</script>
